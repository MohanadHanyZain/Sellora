<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sellora - تسجيل الدخول</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4f46e5',
                        primaryHover: '#4338ca',
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <!-- Navbar -->
    <header class="w-full bg-white border-b border-slate-100 py-4 px-6 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white font-black text-lg shadow-md shadow-indigo-200">
                S
            </div>
            <a href="index.html" class="text-xl font-black tracking-tight text-slate-900">Sellora</a>
        </div>
        <a href="register.html" class="text-sm font-semibold text-indigo-600 hover:text-indigo-700">
            ليس لديك حساب؟ انضم كمسوق
        </a>
    </header>

    <!-- Main Login Container -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="max-w-md w-full bg-white rounded-3xl shadow-xl shadow-slate-100 border border-slate-100 p-8 sm:p-10">
            
            <div class="text-center mb-8">
                <h1 class="text-2xl font-black text-slate-900 mb-2">مرحباً بك مجدداً</h1>
                <p class="text-sm text-slate-500">سجل دخولك للوصول إلى لوحة التحكم ومتابعة أرباحك</p>
            </div>

            <!-- Error/Success Alert Box -->
            <div id="alert-box" class="hidden mb-6 p-4 rounded-xl text-sm font-semibold"></div>

            <!-- Login Form -->
            <form id="login-form" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-2">البريد الإلكتروني</label>
                    <input type="email" id="email" required 
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-600 focus:ring-2 focus:ring-indigo-600/20 outline-none transition-all text-sm"
                        placeholder="name@example.com">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-2">كلمة المرور</label>
                    <input type="password" id="password" required 
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-600 focus:ring-2 focus:ring-indigo-600/20 outline-none transition-all text-sm"
                        placeholder="••••••••">
                </div>

                <button type="submit" id="submit-btn"
                    class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-200 transition-all transform hover:-translate-y-0.5 text-sm">
                    تسجيل الدخول
                </button>
            </form>

        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full text-center py-6 text-xs text-slate-400 border-t border-slate-100 bg-white">
        جميع الحقوق محفوظة منصة Sellora &copy; 2026
    </footer>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- JavaScript Logic -->
    <script type="module">
        import { supabase } from './js/supabaseClient.js';

        const form = document.getElementById('login-form');
        const alertBox = document.getElementById('alert-box');
        const submitBtn = document.getElementById('submit-btn');

        // التحقق من وجود جلسة نشطة مسبقاً
        async function checkExistingSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                const { data: profile } = await supabase.from('profiles').select('role').eq('id', session.user.id).single();
                if (profile) {
                    if (profile.role === 'admin') {
                        window.location.href = 'admin-dash.html';
                    } else {
                        window.location.href = 'reseller-dash.html';
                    }
                }
            }
        }
        checkExistingSession();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            submitBtn.disabled = true;
            submitBtn.textContent = 'جاري التحقق وتسجيل الدخول...';
            alertBox.classList.add('hidden');

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;

                const userId = data.user.id;
                const { data: profile, error: profileError } = await supabase
                    .from('profiles')
                    .select('role')
                    .eq('id', userId)
                    .single();

                if (profileError) throw profileError;

                alertBox.className = 'mb-6 p-4 rounded-xl text-sm font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200';
                alertBox.textContent = 'تم تسجيل الدخول بنجاح! جاري تحويلك...';
                alertBox.classList.remove('hidden');

                setTimeout(() => {
                    if (profile.role === 'admin') {
                        window.location.href = 'admin-dash.html';
                    } else {
                        window.location.href = 'reseller-dash.html';
                    }
                }, 1000);

            } catch (err) {
                alertBox.className = 'mb-6 p-4 rounded-xl text-sm font-semibold bg-rose-50 text-rose-700 border border-rose-200';
                alertBox.textContent = 'خطأ في تسجيل الدخول: ' + (err.message || 'تأكد من البريد أو كلمة المرور');
                alertBox.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.textContent = 'تسجيل الدخول';
            }
        });
    </script>
</body>
</html>
