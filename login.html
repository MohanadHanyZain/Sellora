<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sellora - تسجيل الدخول / إنشاء حساب</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        lightBg: '#f8fafc',
                        lightCard: '#ffffff',
                        lightBorder: '#e2e8f0',
                        emeraldPrimary: '#059669',
                        emeraldHover: '#047857',
                        emeraldLight: '#ecfdf5',
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts (IBM Plex Sans Arabic) -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'IBM Plex Sans Arabic', sans-serif; background-color: #f8fafc; color: #0f172a; }
    </style>
</head>
<body class="bg-lightBg text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <!-- Navbar -->
    <header class="w-full bg-lightCard border-b border-lightBorder py-4 px-4 sm:px-8">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <a href="index.html" class="w-10 h-10 rounded-xl bg-emeraldPrimary flex items-center justify-center text-white font-bold text-xl shadow-sm">
                    S
                </a>
                <div>
                    <a href="index.html" class="text-lg font-bold tracking-tight text-slate-900 block leading-tight">Sellora</a>
                    <span class="text-[10px] font-semibold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-md border border-emerald-200">منصة التسويق</span>
                </div>
            </div>
            <div>
                <a href="index.html" class="px-4 py-2 text-xs sm:text-sm font-semibold text-slate-700 hover:text-emeraldPrimary transition-colors"><i class="fa-solid fa-arrow-right ml-1"></i> الرئيسية</a>
            </div>
        </div>
    </header>

    <!-- Main Content / Form Section -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="max-w-md w-full bg-lightCard border border-lightBorder rounded-3xl p-8 shadow-xs space-y-6">
            
            <!-- Tabs Header -->
            <div class="flex rounded-xl bg-slate-100 p-1 border border-lightBorder">
                <button id="tab-login" onclick="switchTab('login')" class="flex-1 py-2 text-xs font-bold rounded-lg transition-all bg-white text-slate-900 shadow-xs">تسجيل الدخول</button>
                <button id="tab-register" onclick="switchTab('register')" class="flex-1 py-2 text-xs font-bold rounded-lg transition-all text-slate-500 hover:text-slate-900">حساب جديد</button>
            </div>

            <!-- Error / Success Alerts Container -->
            <div id="alert-box" class="hidden p-3 rounded-xl text-xs font-semibold"></div>

            <!-- Login Form -->
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">البريد الإلكتروني</label>
                    <input type="email5" id="login-email" required class="w-full px-3.5 py-2.5 border border-lightBorder rounded-xl text-sm focus:outline-emeraldPrimary">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">كلمة المرور</label>
                    <input type="password" id="login-password" required class="w-full px-3.5 py-2.5 border border-lightBorder rounded-xl text-sm focus:outline-emeraldPrimary">
                </div>
                <button type="submit" class="w-full py-3 bg-emeraldPrimary hover:bg-emeraldHover text-white font-semibold rounded-xl text-sm shadow-md transition-all">
                    تسجيل الدخول
                </button>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">البريد الإلكتروني</label>
                    <input type="email" id="register-email" required class="w-full px-3.5 py-2.5 border border-lightBorder rounded-xl text-sm focus:outline-emeraldPrimary">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">كلمة المرور</label>
                    <input type="password" id="register-password" required class="w-full px-3.5 py-2.5 border border-lightBorder rounded-xl text-sm focus:outline-emeraldPrimary">
                </div>
                <button type="submit" class="w-full py-3 bg-emeraldPrimary hover:bg-emeraldHover text-white font-semibold rounded-xl text-sm shadow-md transition-all">
                    إنشاء حساب مسوق
                </button>
            </form>

        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full bg-lightCard border-t border-lightBorder py-8 px-4 sm:px-8">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4 text-xs text-slate-500">
            <div>
                جميع الحقوق محفوظة منصة Sellora &copy; 2026
            </div>
            <div class="flex items-center gap-6 font-semibold">
                <a href="terms.html" class="hover:text-emeraldPrimary transition-colors">شروط الاستخدام</a>
                <a href="privacy.html" class="hover:text-emeraldPrimary transition-colors">سياسة الخصوصية</a>
            </div>
        </div>
    </footer>

    <!-- Supabase Configuration & Logic Script -->
    <script>
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function switchTab(mode) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const alertBox = document.getElementById('alert-box');

            alertBox.classList.add('hidden');

            if (mode === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                tabLogin.className = 'flex-1 py-2 text-xs font-bold rounded-lg transition-all bg-white text-slate-900 shadow-xs';
                tabRegister.className = 'flex-1 py-2 text-xs font-bold rounded-lg transition-all text-slate-500 hover:text-slate-900';
            } else {
                registerForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                tabRegister.className = 'flex-1 py-2 text-xs font-bold rounded-lg transition-all bg-white text-slate-900 shadow-xs';
                tabLogin.className = 'flex-1 py-2 text-xs font-bold rounded-lg transition-all text-slate-500 hover:text-slate-900';
            }
        }

        function showAlert(message, isError = true) {
            const alertBox = document.getElementById('alert-box');
            alertBox.textContent = message;
            alertBox.className = `p-3 rounded-xl text-xs font-semibold ${isError ? 'bg-rose-50 text-rose-700 border border-rose-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}`;
            alertBox.classList.remove('hidden');
        }

        // Handle Login
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                showAlert(error.message);
            } else {
                window.location.href = 'index.html'; // أو لوحة التحكم الخاصة بالمسوق
            }
        });

        // Handle Register
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('register-email').value.trim();
            const password = document.getElementById('register-password').value;

            const { data, error } = await supabase.auth.signUp({
                email: email,
                password: password,
            });

            if (error) {
                showAlert(error.message);
            } else {
                showAlert('تم إنشاء الحساب بنجاح! يجدر بك تسجيل الدخول الآن.', false);
                switchTab('login');
            }
        });
    </script>
</body>
</html>
